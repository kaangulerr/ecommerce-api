spring.application.name=ecommerce-backend

# MySQL Ba?lant? Bilgilerin
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Ayarlar?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cloudinary Configuration (Yükleme için environment variable'dan alınır)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# JWT Secret Key
jwt.secret=${JWT_SECRET}

# Hata mesajlari
server.error.include-message=always
server.error.include-binding-errors=always

# Multipart (profil resmi icin limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
